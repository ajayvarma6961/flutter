<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goodwork — Find Work That Matters</title>
  <meta http-equiv="refresh" content="0; url=/build/web/">
  <script>
    window.location.replace("/build/web/");
  </script>
  <style>
    body {
      margin: 0;
      background-color: #F8F7F3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #1B4931;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(27, 73, 49, 0.2);
      border-top-color: #1B4931;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    a {
      color: #2D6A4F;
      font-size: 14px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Opening Goodwork App...</p>
  <a href="/build/web/">Click here if not redirected automatically</a>
</body>
</html>
